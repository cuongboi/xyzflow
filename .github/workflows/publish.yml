name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Verify tag matches package version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/react/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package README
        run: test -s packages/react/README.md || { echo 'packages/react/README.md missing' >&2; exit 1; }

      - name: Publish to npm
        working-directory: packages/react
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "xyzflow@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "xyzflow@${{ steps.version.outputs.version }} already published, skipping"
          else
            bun publish --access public
          fi

      - name: Pack tarball
        working-directory: packages/react
        run: bun pm pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: packages/react/*.tgz
