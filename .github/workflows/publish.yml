name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Verify package README
        run: test -s packages/react/README.md || { echo 'packages/react/README.md missing' >&2; exit 1; }

      - name: Bump version
        id: version
        working-directory: packages/react
        run: |
          if [ "${{ inputs.bump }}" = "prerelease" ]; then
            bun pm version prerelease --preid beta --no-git-tag-version
          else
            bun pm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$V"
          git tag "v$V"
          git push origin HEAD "v$V"

      - name: Publish to npm
        working-directory: packages/react
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          if npm view "xyzflow@$V" version >/dev/null 2>&1; then
            echo "xyzflow@$V already published, skipping"
          else
            bun publish --access public
          fi

      - name: Pack tarball
        working-directory: packages/react
        run: bun pm pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: packages/react/*.tgz
